<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>탄소로운 식탁 · 지구 4단계 미리보기</title>
<style>
  body { margin: 0; padding: 14px 16px; background: #eef4fb; color: #0c1a26;
         font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { font-size: 12px; color: #455c70; margin: 0 0 10px; }
  .row { display: flex; gap: 14px; align-items: flex-start; }
  .col { width: 236px; border: 2px solid #0c1a26; background: #fff; padding: 6px; }
  .col h2 { font-size: 13px; margin: 0 0 4px; display: flex; justify-content: space-between; }
  .col h2 small { font-weight: 600; color: #455c70; }
  .cap { font-size: 10.5px; color: #455c70; margin: 2px 0 4px; font-weight: 700; }
  svg { display: block; width: 100%; height: auto; border: 1px solid #d3e2f0; }
  .mood { font-size: 11px; font-weight: 800; color: #0c1a26; margin-top: 4px; }
</style>
<div id="app"></div>
<script type="module">
import { earthSvg, earthLook, earthMood } from '../src/earth.js';

const STATES = [
  [0, '안정 (시원함)'],
  [0.22, '온난화 주의'],
  [0.55, '기후 위기 경고'],
  [0.92, '임계점 돌파 (폭염)'],
];

// 자전·구름 애니메이션을 멈추고 한반도가 가운데 오도록 고정합니다 (그림만 비교하려고요)
const fix = (svg) => svg
  .replace('class="earth-spin earth-spin-land"', 'transform="translate(-70 0)"')
  .replace('class="earth-spin earth-spin-clouds"', 'transform="translate(-28 0)"')
  .replace(/ viewBox="0 0 240 240"/g, (m) => m);

const crop = (svg, vb) => fix(svg).replace('viewBox="0 0 240 240"', `viewBox="${vb}"`);

const html = STATES.map(([p, name]) => {
  const svg = earthSvg(p);
  const look = earthLook(p);
  return `<div class="col">
    <h2>${name}<small>${look.temp}</small></h2>
    <div class="cap">지구 전체 · 온난화 지수 ${Math.round(p * 100)}%</div>
    ${fix(svg)}
    <div class="cap">한반도 확대 — 사람</div>
    ${crop(svg, '178 64 38 38')}
    <div class="cap">북극 확대 — 북극곰</div>
    ${crop(svg, '102 24 38 38')}
    <div class="mood">${earthMood(p)}</div>
  </div>`;
}).join('');

document.getElementById('app').innerHTML = `
  <h1>탄소로운 식탁 · 지구 그림 4단계</h1>
  <p class="sub">실제 대륙 윤곽 · 극지방 빙하(부드러운 경계) · 한반도의 사람과 북극곰 표정 비교</p>
  <div class="row">${html}</div>`;
</script>
</html>
