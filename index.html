<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>탄소로운 식탁 · BMR APPS</title>
<meta name="description" content="탄소로운 식탁 — 별무리 사람들이 기후 실천으로 모은 공기를 기록하고, 그 공기로 물건을 나누는 카본 옥션.">
<meta name="theme-color" content="#0f3d2e">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="icon" href="https://psupfmarnyxontorftio.supabase.co/functions/v1/hub-favicon?slug=carbonic-table">
</head>
<body data-view="home">
<a class="skip" href="#main">본문으로 바로 가기</a>

<header class="top">
  <a class="mark" href="./" aria-label="탄소로운 식탁 홈">
    <svg viewBox="0 0 48 48" role="img" aria-hidden="true" focusable="false">
      <circle cx="24" cy="26" r="15.5" fill="#fff" stroke="#000" stroke-width="2.5"/>
      <circle cx="24" cy="26" r="9.5" fill="#ffdc1a" stroke="#000" stroke-width="2"/>
      <path d="M24 24c0-4.2 2.9-7.5 7.2-7.8-.2 4.5-3 7.6-7.2 7.8z" fill="#02c245" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
      <path d="M24 24c-.6-3.2-3.2-5.4-6.7-5.1.7 3.7 3.1 5.6 6.7 5.1z" fill="#0abbee" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
      <path d="M24 24v7" stroke="#000" stroke-width="2" stroke-linecap="round"/>
      <circle cx="38" cy="9" r="2.2" fill="#0abbee" stroke="#000" stroke-width="1.6"/>
      <circle cx="43" cy="15" r="1.6" fill="#ffdc1a" stroke="#000" stroke-width="1.4"/>
    </svg>
  </a>
  <div class="brand">
    <b data-app-name>탄소로운 식탁</b>
    <small>별무리 기후 실천 통장</small>
  </div>

  <nav class="nav" id="nav" aria-label="화면 고르기">
    <button type="button" class="nav-item on" data-nav="home" aria-current="page">현황</button>
    <button type="button" class="nav-item" data-nav="practices">실천</button>
    <button type="button" class="nav-item" data-nav="mine">내 기록</button>
    <button type="button" class="nav-item" data-nav="ranking">랭킹</button>
    <button type="button" class="nav-item" data-nav="auctions">카본 옥션</button>
    <button type="button" class="nav-item" data-nav="admin" aria-label="관리자" hidden><span aria-hidden="true">🛠️</span> 관리</button>
  </nav>

  <div class="top-right">
    <button type="button" class="icon-btn" id="theme" aria-label="어두운 화면으로 바꾸기" title="화면 밝기">
      <span class="theme-mark" aria-hidden="true">◐</span>
    </button>
    <span class="who" id="who" hidden></span>
    <button type="button" class="btn btn-google" id="login" data-action="login" aria-label="구글 로그인">
      <span class="g" aria-hidden="true">G</span> 구글 로그인
    </button>
    <button type="button" class="btn ghost" id="logout" data-action="logout" hidden>로그아웃</button>
  </div>
</header>

<div class="season-strip" id="season-strip" hidden>
  <span class="season-label" aria-hidden="true">🌿 시즌</span>
  <select id="season-pick" aria-label="시즌 고르기"></select>
  <span class="season-meta" id="season-meta"></span>
  <span class="season-live" id="season-live" hidden>지난 시즌을 보고 있어요</span>
</div>

<div class="banner" id="banner" role="status" hidden></div>
<div class="notice-rail" id="notice-rail" hidden></div>

<main id="main" tabindex="-1">
  <div class="booting" id="booting">
    <span class="spin" aria-hidden="true"></span> 실천 통장을 펼치는 중…
  </div>
</main>

<footer class="foot">
  <span>별무리가 함께 만드는 기후 실천 기록 · <a href="https://apps.bmrschool.net/">BMR APPS</a></span>
</footer>

<dialog class="modal" id="profile-dialog" aria-labelledby="profile-title">
  <form id="profile-form" novalidate>
    <h2 id="profile-title">내 정보 등록</h2>
    <p class="modal-desc">실천을 기록하려면 이름과 구분이 필요해요. 한 번만 정하면 됩니다.</p>
    <fieldset class="kind-pick">
      <legend>구분</legend>
      <label><input type="radio" name="kind" value="10학년"> <span>10학년</span></label>
      <label><input type="radio" name="kind" value="11학년"> <span>11학년</span></label>
      <label><input type="radio" name="kind" value="12학년"> <span>12학년</span></label>
      <label><input type="radio" name="kind" value="교사"> <span>교사</span></label>
    </fieldset>
    <label class="field">
      <span>이름</span>
      <input type="text" name="name" maxlength="20" placeholder="예: 조은길" autocomplete="name" required>
    </label>
    <p class="hint">관리자 권한은 관리자 탭에서 따로 줍니다. 구분은 랭킹·통계에 쓰여요.</p>
    <div class="modal-actions">
      <button type="button" class="btn ghost" data-action="close-dialog">취소</button>
      <button type="submit" class="btn primary">저장</button>
    </div>
    <button type="button" class="btn tiny danger" data-action="delete-profile">회원 정보 지우기 (기록이 없을 때만)</button>
  </form>
</dialog>

<dialog class="modal image-modal" id="image-dialog" aria-labelledby="image-dialog-title">
  <h2 id="image-dialog-title" class="sr-only">사진 크게 보기</h2>
  <img id="image-dialog-img" alt="크게 본 사진">
  <div class="modal-actions">
    <button type="button" class="btn ghost" data-action="close-dialog">닫기</button>
  </div>
</dialog>

<dialog class="modal modal-sm" id="confirm-dialog" aria-labelledby="confirm-title">
  <h2 id="confirm-title" class="sr-only">확인</h2>
  <p class="confirm-text" id="confirm-text"></p>
  <div class="modal-actions">
    <button type="button" class="btn ghost" id="confirm-no">취소</button>
    <button type="button" class="btn danger" id="confirm-yes">확인</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
